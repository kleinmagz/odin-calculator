<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Odin Calculator</title>
   <link href="./styles.css" rel="stylesheet" />
   <script src="./script.js" defer></script>
</head>
<body>
   <div id="calculator">
      <input id="display" readonly>
      <div class="buttons">
         <div id="digits">
         </div>
         <div id="operators">
            <button>+</button>
            <button>-</button>
            <button>÷</button>
            <button>x</button>
         </div>
         <div class="special">
            <button id="clear">CE</button>
            <button id="calculate">=</button>
         </div>
      </div>
   </div>
</body>
</html>
